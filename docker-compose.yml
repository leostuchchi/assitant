services:
  postgres:
    image: postgres:16
    container_name: postgres_astra
    environment:
      POSTGRES_DB: astra_db
      POSTGRES_USER: astra_user
      POSTGRES_PASSWORD: astra_password_2024
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-init-tables.sql:/docker-entrypoint-initdb.d/01-init-tables.sql
    restart: unless-stopped

  astra_bot:
    build:
      context: .
      dockerfile: Dockerfile.bot.dev
    container_name: astra_bot
    environment:
      - DATABASE_URL=postgresql+asyncpg://astra_user:astra_password_2024@postgres:5432/astra_db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://astra_api:8000
    depends_on:
      - postgres
      - astra_api
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./ephe:/app/ephe:ro
      - ./backend:/app/backend    # ДОБАВИТЬ
      - ./bot:/app/bot            # ДОБАВИТЬ

  astra_api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: astra_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://astra_user:astra_password_2024@postgres:5432/astra_db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONPATH=/app
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./ephe:/app/ephe:ro
      - ./backend:/app/backend
      # bot не нужен для API

volumes:
  postgres_data:
